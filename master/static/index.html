<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starfruit · 多节点协同面板</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/static/img/favicon-128.png">
<link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar glass">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <img src="/static/img/logo.svg" width="34" height="34" alt="">
    </div>
    <div class="brand-text">
      <h1>starfruit</h1>
      <p><span data-i18n="subtitle">多节点 WS 协同面板</span> <span class="ro-badge">READ-ONLY</span></p>
    </div>
  </div>
  <div class="chips">
    <div class="chip"><span class="chip-label" data-i18n="mode">模式</span><span class="chip-value" id="stat-mode">–</span></div>
    <div class="chip"><span class="chip-label" data-i18n="online">在线节点</span><span class="chip-value" id="stat-online">–</span></div>
    <div class="chip"><span class="chip-label" data-i18n="msgs">消息总数</span><span class="chip-value" id="stat-msgs">–</span></div>
    <div class="chip"><span class="chip-label" data-i18n="uptime">运行时长</span><span class="chip-value" id="stat-uptime">–</span></div>
    <div class="chip live-chip"><span class="live-dot" id="live-dot"></span><span class="chip-value" id="live-state">…</span></div>
    <button id="history-btn" class="chip chip-btn" type="button"><span class="chip-value">▤ <span data-i18n="history">消息历史</span></span></button>
    <button id="lang-btn" class="chip chip-btn" type="button" title="中文 / English"><span class="chip-value" id="lang-label">EN</span></button>
  </div>
</header>

<div id="update-banner" class="update-banner glass" hidden>
  <span id="update-text"></span>
  <a id="update-link" href="https://github.com/chunshilaioqf/starfruit-skill" target="_blank" rel="noopener" data-i18n="viewRepo">前往仓库</a>
</div>

<main class="layout">
  <section class="panel nodes-panel glass">
    <h2><span class="h-icon">◧</span><span data-i18n="nodes">节点</span> <span class="count" id="node-count"></span></h2>
    <div id="node-list" class="node-list"></div>
  </section>

  <section class="panel canvas-panel glass">
    <h2><span class="h-icon">✦</span><span data-i18n="topology">消息流转拓扑</span>
      <button id="color-btn" class="color-toggle" type="button" data-i18n="colorMulti">多彩配色</button>
    </h2>
    <div class="canvas-wrap">
      <canvas id="topo"></canvas>
      <div id="node-popup" class="node-popup glass" hidden></div>
    </div>
    <div class="legend">
      <span><i class="lg-dot hub"></i><span data-i18n="legendHub">主节点 hub</span></span>
      <span><i class="lg-dot online"></i><span data-i18n="legendOnline">在线</span></span>
      <span><i class="lg-dot offline"></i><span data-i18n="legendOffline">离线</span></span>
      <span><i class="lg-line"></i><span data-i18n="legendFlow">消息流动</span></span>
      <span class="hint" data-i18n="topoHint">点击节点查看最近消息</span>
    </div>
  </section>

  <section class="panel feed-panel glass">
    <h2><span class="h-icon">≋</span><span data-i18n="feed">实时消息</span> <span class="hint" data-i18n="feedHint">最新 60 条</span></h2>
    <div id="feed" class="feed"></div>
  </section>
</main>

<div id="history-mask" class="modal-mask" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="history-head">
      <h2><span class="h-icon">▤</span><span data-i18n="history">消息历史</span></h2>
      <div class="filters">
        <label><span data-i18n="from">从</span> <select id="f-from"><option value="" data-i18n="all">全部</option></select></label>
        <label><span data-i18n="type">类型</span> <select id="f-type">
          <option value="" data-i18n="all">全部</option>
          <option>task</option><option>status</option><option>done</option>
          <option>blocked</option><option>idle</option><option>notice</option>
          <option>chat</option><option>wake</option><option>system</option>
        </select></label>
        <label><span data-i18n="contains">包含</span> <input id="f-text" type="search" data-i18n-ph="filterPh" placeholder="过滤文本…"></label>
      </div>
      <button id="history-close" class="modal-close" type="button" aria-label="close">✕</button>
    </div>
    <div class="table-wrap">
      <table id="history-table">
        <thead>
          <tr>
            <th>#</th><th data-i18n="thTime">时间</th><th data-i18n="thFrom">发送方</th>
            <th data-i18n="thTo">接收方</th><th data-i18n="thType">类型</th>
            <th data-i18n="thStatus">状态</th><th data-i18n="thContent">内容</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <div class="history-foot">
      <button id="load-more" class="btn" data-i18n="loadMore">加载更早</button>
      <span class="hint" id="history-hint"></span>
    </div>
  </div>
</div>

<footer class="foot">
  starfruit panel · <span data-i18n="foot">无鉴权 · 全部只读</span> · <span id="foot-mode"></span>
  · <a id="repo-link" href="https://github.com/chunshilaioqf/starfruit-skill" target="_blank" rel="noopener">GitHub</a>
  · <span id="foot-version"></span>
</footer>
<script src="/app.js"></script>
</body>
</html>
